# Orquestador para todo el monorepo (FRONT + BACK)
# Uso: desde la raíz RRHH -> docker compose up -d --build

services:
  # PHP-FPM (Laravel)
  app:
    build:
      context: ./BACK
      dockerfile: Dockerfile
    image: rrhh_back_app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./BACK:/var/www/html:delegated
      - back_vendor:/var/www/html/vendor
      - back_node_modules:/var/www/html/node_modules
    # Root .env (single file on the server, see .env.production.example).
    # In dev Laravel also reads BACK/.env; variables set here take precedence.
    env_file:
      - path: ./.env
        required: false
    environment:
      # APP_DEBUG defaults to false so a forgotten production deploy does not
      # expose debug pages (env/stack traces). Create a root .env with
      # APP_DEBUG=true while developing locally.
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=back_db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      # Reverb: app container must reach the back_reverb service by Docker hostname
      - REVERB_HOST=back_reverb
      - REVERB_PORT=6001
      - SANCTUM_EXPIRATION=10080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\",9000) ? 0 : 1);'"]
      interval: 10s
      timeout: 2s
      retries: 3
      start_period: 5s
    depends_on:
      - back_db

  # Nginx (servirá la API en http://localhost:8000)
  back_nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./BACK:/var/www/html:delegated
      - ./BACK/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app

  # Base de datos (MySQL)
  back_db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${DB_DATABASE:-laravel}
      MYSQL_USER: ${DB_USERNAME:-laravel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      # Solo en 127.0.0.1: accesible desde tu PC (DBeaver, etc.) pero no desde la red.
      - "127.0.0.1:3306:3306"
    # Credenciales: definir DB_PASSWORD / DB_ROOT_PASSWORD en el .env raiz (defaults solo para dev)
    volumes:
      - back_dbdata:/var/lib/mysql
      # crea la base laravel_testing (tests) la primera vez que se crea el volumen
      - ./BACK/docker/mysql/init:/docker-entrypoint-initdb.d:ro

  # Reverb WebSocket server – correrlo en la misma imagen que el backend
  back_reverb:
    build:
      context: ./BACK
      dockerfile: Dockerfile
    image: rrhh_back_reverb:latest
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./BACK:/var/www/html:delegated
      - back_vendor:/var/www/html/vendor
    env_file:
      - path: ./.env
        required: false
    environment:
      - REVERB_SERVER_HOST=0.0.0.0
      - REVERB_SERVER_PORT=6001
      - DB_HOST=back_db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      # Reverb sólo necesita la DB para el cache de "restart signal".
      # Usar cache de archivo evita el fallo si la DB todavía no está lista.
      - CACHE_STORE=file
    ports:
      - "6001:6001"
    command: php artisan reverb:start --host=0.0.0.0 --port=6001
    depends_on:
      - back_db
      - app

  # Queue worker — processes any queued jobs (e.g. emails, notifications).
  # NOTE: MessageSent now uses ShouldBroadcastNow so broadcasts bypass this queue,
  # but keeping the worker ensures other queued jobs (mail, etc.) are processed.
  queue:
    build:
      context: ./BACK
      dockerfile: Dockerfile
    image: rrhh_back_app:latest
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --sleep=1 --tries=3 --timeout=60
    volumes:
      - ./BACK:/var/www/html:delegated
      - back_vendor:/var/www/html/vendor
    env_file:
      - path: ./.env
        required: false
    environment:
      - APP_ENV=${APP_ENV:-local}
      - APP_DEBUG=${APP_DEBUG:-false}
      - DB_CONNECTION=mysql
      - DB_HOST=back_db
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-laravel}
      - DB_USERNAME=${DB_USERNAME:-laravel}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - REVERB_HOST=back_reverb
      - REVERB_PORT=6001
      - SANCTUM_EXPIRATION=10080
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
    depends_on:
      - back_db
      - back_reverb

  # Frontend (Nuxt dev server) — puede consumir la API vía http://back_nginx
  front:
    build:
      context: ./FRONT
      dockerfile: Dockerfile
      target: dev
    image: rrhh_front:latest
    restart: unless-stopped
    working_dir: /app
    user: root
    # Root .env (server) and, in dev, FRONT/.env on top of it.
    env_file:
      - path: ./.env
        required: false
      - path: ./FRONT/.env
        required: false
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      # bind mounts en Windows no emiten eventos inotify -> forzar polling
      # para que nuxi/vite recarguen al editar archivos sin reiniciar el contenedor
      - CHOKIDAR_USEPOLLING=true
      # El navegador llama a /api/* en el mismo origen (Nuxt); el proxy de
      # Nitro reenvía la petición a back_nginx con la cookie de sesión, así
      # que el navegador nunca habla con la API ni necesita CORS.
      - NUXT_API_BASE=http://back_nginx
      # Solo para assets estáticos (/storage/avatares...): URL base que el
      # navegador sí debe alcanzar directamente.
      - NUXT_PUBLIC_API_BASE=http://localhost:8000
      # Reverb: en acceso directo (localhost:3000) el navegador usa el puerto
      # 6001 expuesto en el host. Detrás del gateway/túnel se usa el mismo
      # origen (wss://<dominio>/app/...), ver composables/useRealtime.ts.
      - NUXT_PUBLIC_REVERB_HOST=localhost
      - NUXT_PUBLIC_REVERB_PORT=6001
      # Hosts públicos aceptados por el dev server (Vite bloquea los demás).
      # Al tener dominio propio añadir el subdominio en el .env raíz, p.ej.:
      #   PUBLIC_HOSTS=.trycloudflare.com,rrhh.nanodev.com
      - PUBLIC_HOSTS=${PUBLIC_HOSTS:-.trycloudflare.com}
    ports:
      - "3000:3000"
    command: sh -c "npm install --no-audit --no-fund && npx nuxi dev /app --hostname 0.0.0.0 --port 3000"
    volumes:
      - ./FRONT:/app:delegated
      - front_node_modules:/app/node_modules
    depends_on:
      - back_nginx

  # Punto de entrada público único: front + Reverb (WebSocket) + /storage en
  # el mismo origen. Es a donde apunta el túnel de Cloudflare.
  # Local: http://localhost:8080 (todo por el mismo origen, igual que en el túnel).
  gateway:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./docker/gateway/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - front
      - back_reverb
      - back_nginx

  # --- Cloudflare tunnel (se activa con COMPOSE_PROFILES en el .env raíz) ---
  # Quick tunnel: sin cuenta ni dominio, URL aleatoria *.trycloudflare.com
  # que cambia en cada arranque. Ver la URL:
  #   docker compose logs tunnel | Select-String trycloudflare
  # Activar con: COMPOSE_PROFILES=tunnel
  tunnel:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://gateway:80
    depends_on:
      - gateway

  # Named tunnel: dominio propio (p.ej. rrhh.nanodev.com), URL fija.
  # En Cloudflare Zero Trust > Networks > Tunnels crear el túnel, copiar el
  # token y en "Public hostname" poner rrhh.nanodev.com -> http://gateway:80.
  # Activar con: COMPOSE_PROFILES=tunnel-domain y CLOUDFLARE_TUNNEL_TOKEN=...
  tunnel-domain:
    image: cloudflare/cloudflared:2024.12.2
    profiles: ["tunnel-domain"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - gateway

volumes:
  back_vendor:
  back_node_modules:
  back_dbdata:
  front_node_modules:
