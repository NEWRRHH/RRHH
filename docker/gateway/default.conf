# Single public entry point (used by the Cloudflare tunnel).
# Everything the browser needs lives on ONE origin, so the tunnel (quick or
# named, e.g. rrhh.nanodev.com) only has to point at http://gateway:80:
#   /app/*, /apps/*  -> Reverb (WebSocket, Pusher protocol)
#   /storage/*       -> Laravel public files (avatars, documents...)
#   everything else  -> Nuxt (pages, /api/* Nitro proxy, Vite HMR)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # Resolve service names at request time (Docker DNS) so recreating a
    # container (new IP) does not leave the gateway answering 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $reverb_upstream  back_reverb:6001;
    set $storage_upstream back_nginx:80;
    set $front_upstream   front:3000;

    # Common proxy headers. Host is kept so Nuxt sees the public hostname.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Reverb WebSocket endpoint (/app/{key}) and its HTTP API (/apps/{id}).
    location ~ ^/apps?/ {
        proxy_pass http://$reverb_upstream;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /storage/ {
        proxy_pass http://$storage_upstream;
    }

    location / {
        proxy_pass http://$front_upstream;
        proxy_read_timeout 3600s;
    }
}
